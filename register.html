<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <style>
      :root {
        --bg-dark: #0f172a;
        --bg-mid: #111827;
        --panel: rgba(15, 23, 42, 0.72);
        --panel-strong: rgba(15, 23, 42, 0.9);
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.12);
        --text: #e5eefb;
        --muted: #a9b5d1;
        --primary: #7c3aed;
        --primary-2: #22c55e;
        --accent: #38bdf8;
        --shadow: 0 30px 60px rgba(15, 23, 42, 0.45);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(124, 58, 237, 0.35), transparent 35%),
          radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.2), transparent 30%),
          linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
        color: var(--text);
      }

      .page-shell {
        width: min(1100px, 92vw);
        min-height: 760px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid var(--border);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .brand-panel {
        position: relative;
        padding: 52px 54px;
        background:
          linear-gradient(160deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.78)),
          url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      }

      .brand-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.75));
      }

      .brand-panel > * {
        position: relative;
        z-index: 1;
      }

      .brand-top {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f3f7ff;
      }

      .brand-badge {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        box-shadow: 0 12px 24px rgba(124, 58, 237, 0.45);
        font-size: 1.2rem;
      }

      .hero-content {
        margin-top: 90px;
        max-width: 460px;
      }

      .eyebrow {
        display: inline-flex;
        padding: 8px 14px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        color: #dfeaff;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 24px 0 16px;
        font-size: clamp(2.6rem, 4vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .hero-copy {
        margin: 0;
        line-height: 1.7;
        color: #dfeafc;
        max-width: 35ch;
      }

      .stats {
        margin-top: 38px;
        display: flex;
        gap: 30px;
        flex-wrap: wrap;
      }

      .stat {
        min-width: 120px;
      }

      .stat strong {
        display: block;
        font-size: 1.8rem;
        font-weight: 700;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .login-panel {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 44px 34px;
        background: rgba(10, 15, 28, 0.72);
      }

      .login-card {
        width: 100%;
        max-width: 430px;
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 30px 28px 26px;
        box-shadow: 0 25px 50px rgba(2, 6, 23, 0.35);
      }

      .login-header {
        margin-bottom: 26px;
      }

      .login-header h2 {
        margin: 0 0 8px;
        font-size: 2rem;
        letter-spacing: -0.04em;
      }

      .login-header p {
        margin: 0;
        color: var(--muted);
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: inline-block;
        margin-bottom: 8px;
        font-size: 0.82rem;
        color: #dfeaff;
      }

      .input-wrap {
        position: relative;
      }

      .input-wrap input {
        width: 100%;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 12px;
        padding: 15px 16px 15px 44px;
        color: var(--text);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .input-wrap input:focus {
        border-color: rgba(124, 58, 237, 0.8);
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
      }

      .input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 1rem;
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: var(--muted);
        font-weight: 600;
        cursor: pointer;
      }

      .submit-btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        min-height: 52px;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: #fff;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 16px 28px rgba(124, 58, 237, 0.35);
      }

      .submit-btn:hover {
        transform: translateY(-1px);
      }

      .signup {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .signup a {
        color: #d8ccff;
        text-decoration: none;
        font-weight: 600;
      }

      @media (max-width: 850px) {
        .page-shell {
          grid-template-columns: 1fr;
        }

        .brand-panel {
          min-height: 300px;
          padding-bottom: 26px;
        }

        .hero-content {
          margin-top: 48px;
        }
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 22px 18px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="brand-panel">
        <div class="brand-top">
          <div class="brand-badge">✦</div>
          <span>NovaFlow</span>
        </div>

        <div class="hero-content">
          <span class="eyebrow">Create account</span>
          <h1>Start your next chapter with confidence.</h1>
          <p class="hero-copy">
            Build your workspace, track your success, and move your projects forward from one place.
          </p>

          <div class="stats">
            <div class="stat">
              <strong>24k+</strong>
              <span>Active users</span>
            </div>
            <div class="stat">
              <strong>9.8/10</strong>
              <span>Customer love</span>
            </div>
          </div>
        </div>
      </section>

      <section class="login-panel">
        <div class="login-card">
          <div class="login-header">
            <h2>Register</h2>
            <p>Create your free account</p>
          </div>

          <form id="registerForm">
            <div class="form-group">
              <label for="fullName">Full name</label>
              <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input id="fullName" type="text" placeholder="Your full name" required />
              </div>
            </div>

            <div class="form-group">
              <label for="email">Email address</label>
              <div class="input-wrap">
                <span class="input-icon">✉</span>
                <input id="email" type="email" placeholder="you@example.com" required />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-wrap">
                <span class="input-icon">🔒</span>
                <input id="password" type="password" placeholder="Create a password" required />
                <button class="toggle-password" type="button" data-target="password">Show</button>
              </div>
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm password</label>
              <div class="input-wrap">
                <span class="input-icon">🔐</span>
                <input id="confirmPassword" type="password" placeholder="Repeat your password" required />
                <button class="toggle-password" type="button" data-target="confirmPassword">Show</button>
              </div>
            </div>

            <button class="submit-btn" type="submit">Create account</button>
          </form>

          <div class="signup">
            Already have an account? <a href="login.html">Sign in</a>
          </div>
        </div>
      </section>
    </main>

    <script>
      const registerForm = document.getElementById('registerForm');
      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirmPassword');

      document.querySelectorAll('.toggle-password').forEach((button) => {
        button.addEventListener('click', () => {
          const input = document.getElementById(button.dataset.target);
          const isHidden = input.type === 'password';
          input.type = isHidden ? 'text' : 'password';
          button.textContent = isHidden ? 'Hide' : 'Show';
        });
      });

      registerForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = passwordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();

        if (!fullName || !email || !password || !confirmPassword) {
          alert('Please complete all fields.');
          return;
        }

        if (password.length < 6) {
          alert('Password must be at least 6 characters long.');
          return;
        }

        if (password !== confirmPassword) {
          alert('Passwords do not match.');
          return;
        }

        const users = JSON.parse(localStorage.getItem('novaUsers') || '[]');
        const emailExists = users.some((user) => user.email.toLowerCase() === email.toLowerCase());

        if (emailExists) {
          alert('This email is already registered. Please sign in instead.');
          return;
        }

        const newUser = {
          fullName,
          displayName: fullName.split(' ')[0],
          email,
          password,
          createdAt: new Date().toISOString()
        };

        users.push(newUser);
        localStorage.setItem('novaUsers', JSON.stringify(users));
        localStorage.setItem('novaUser', JSON.stringify({
          email: newUser.email,
          displayName: newUser.displayName,
          loggedInAt: new Date().toISOString()
        }));

        window.location.href = 'dashboard.html';
      });
    </script>
  </body>
</html>
